  <text x="56" y="184" class="row" style="animation-delay:.7s"><tspan class="v">learning</tspan><tspan class="p">: [</tspan><tspan class="s">"Backend"</tspan><tspan class="p">, </tspan><tspan class="s">"DevOps"</tspan><tspan class="p">],</tspan></text>
