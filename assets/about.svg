<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
<style>
  .mono{font:500 15px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
  .sans{font:500 15px 'Segoe UI',-apple-system,Ubuntu,'Helvetica Neue',sans-serif}
  .h{font:700 13px 'Segoe UI',-apple-system,Ubuntu,sans-serif;letter-spacing:2px;fill:#7d8590}
  .k{fill:#ff7b72}.v{fill:#79c0ff}.s{fill:#a5d6ff}.p{fill:#e6edf3}.c{fill:#8b949e}.t{fill:#e6edf3}.b{fill:#58a6ff;font-weight:700}
  .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .row{opacity:0;animation:in .5s ease forwards}
  @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.row,.cur{animation:none;opacity:1}}
</style>
